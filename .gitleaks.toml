title = "Decoy Wallet gitleaks config"

[extend]
useDefault = true

# Example / placeholder client config only. Real lib/backend files should still
# alert on unexpected high-entropy secrets so a service-role JWT cannot hide.
[[allowlists]]
description = "Example Firebase / Google services placeholders"
paths = [
  '''(^|/)google-services\.json\.example$''',
  '''(^|/)GoogleService-Info\.plist\.example$''',
  '''\.example$''',
]
